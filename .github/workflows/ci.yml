# GitHub Actions workflow for Continuous Integration (CI)
# This pipeline validates Composer config, installs dependencies, audits for vulnerabilities,
# enforces PSR-12 coding standards via PHPCS (lint job), runs PHPUnit tests with coverage (tests job),
# and verifies compatibility with the lowest allowed dependency versions (lowest-deps job).
# Runtime installation is checked on PHP 8.1; PHPUnit runs on PHP 8.3+ because it is a dev dependency.
name: CI

# Concurrency prevents duplicate runs on the same branch/PR by cancelling in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately NO paths / paths-ignore filters here.
#
# Lint, Analyse and Tests are required status checks on main. When a workflow is
# skipped by a path filter its checks are never reported, so they sit at
# "Expected - waiting for status to be reported" and the pull request can never
# be merged. A docs-only change would deadlock. (A job skipped by an `if:`
# condition is different - that reports Success and does not block.)
#
# The saving was roughly a minute of runner time on docs-only changes, which is
# not worth an unmergeable pull request. If it ever becomes worth it, gate the
# individual jobs with `if:` on a changed-files step rather than filtering the
# workflow trigger.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual runs from the Actions UI.
  workflow_dispatch:

jobs:
  # Fast linting feedback - run on ALL PRs including Dependabot
  lint:
    name: Lint (PHP 8.3)
    runs-on: ubuntu-latest
    # Remove the dependabot exclusion - we want basic validation on all PRs
    steps:
      # Download the repository source code to the runner
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install PHP with required extensions and configure memory limit
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring  # Required extensions for the project
          coverage: none  # No coverage needed for linting job
          ini-values: memory_limit=-1  # Remove memory limit for Composer operations

      # Validate composer manifest
      - name: Validate composer.json
        run: composer ci:validate

      # Install project dependencies using cached composer packages for speed
      - name: Install dependencies (with cache)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress --no-interaction

      # Check for known security vulnerabilities in dependencies
      - name: Composer audit
        run: composer ci:audit

      # Enforce PSR-12 coding standards on source and test files
      - name: Run PHP CodeSniffer (PSR-12)
        run: composer lint

      # Validate language compatibility for supported runtime versions
      - name: Run PHPCompatibility checks (PHP 8.1+)
        run: composer lint:compat

  # Static analysis - catch potential bugs and type mismatches
  analyse:
    name: Analyse (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring
          coverage: none
          ini-values: memory_limit=-1

      - name: Install dependencies (with cache)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer analyse

  # Full test matrix - runs on every pull request, unconditionally.
  #
  # Deliberately NO `if:` gate here, for the same reason the workflow has no
  # paths filter. "Tests (PHP 8.3)" is a required status check on main, and this
  # is a matrix job: when a matrix job is skipped, GitHub cannot expand
  # `matrix.php-version`, so the check is reported under the literal name
  # "Tests (PHP ${{ matrix.php-version }})". The required check never appears at
  # all and the pull request deadlocks on "Expected - waiting for status to be
  # reported". A previous `if:` here excluded Dependabot's action-only updates
  # and made every one of those pull requests unmergeable without bypassing the
  # ruleset.
  #
  # The saving was a few tens of seconds of runner time on the handful of
  # Dependabot CI bumps per week. Any future gating of a required check must use
  # an aggregate job (`needs:` everything, `if: always()`, inspect results) that
  # always reports under a fixed name - never an `if:` on the required job.
  tests:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [lint, analyse]
    strategy:
      # Continue running all matrix jobs even if one fails to get full coverage of results.
      fail-fast: false
      matrix:
        # PHPUnit 12 is a dev dependency and requires PHP 8.3+.
        php-version: ['8.3']

    steps:
      # Download the repository source code to the runner
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install PHP with conditional coverage (Xdebug only on PHP 8.3)
      - name: Setup PHP (no coverage)
        if: ${{ matrix.php-version != '8.3' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, mbstring  # Required extensions for the project
          coverage: none  # Disable coverage for non-8.3 versions
          ini-values: memory_limit=-1  # Remove memory limit for Composer operations

      - name: Setup PHP (with Xdebug)
        if: ${{ matrix.php-version == '8.3' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, mbstring  # Required extensions for the project
          coverage: xdebug  # Enable Xdebug for code coverage collection on 8.3 only
          ini-values: memory_limit=-1  # Remove memory limit for Composer operations

      # Install project dependencies using cached composer packages for speed
      - name: Install dependencies (with cache)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress --no-interaction

      # Execute PHPUnit for non-coverage PHP versions
      - name: Run PHPUnit (no coverage)
        if: ${{ matrix.php-version != '8.3' }}
        run: composer test

      # Execute PHPUnit with coverage and XML reporting (PHP 8.3 only)
      - name: Run PHPUnit with coverage
        if: ${{ matrix.php-version == '8.3' }}
        run: composer test:coverage

      # Upload test results and coverage data as artifacts (PHP 8.3 only)
      - name: Upload coverage artifacts
        if: ${{ always() && matrix.php-version == '8.3' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: |
            build/logs/clover.xml
            build/logs/junit.xml

  # Lowest deps - only for production dependency updates
  lowest-deps:
    name: Lowest Deps (PHP 8.3)
    runs-on: ubuntu-latest
    # Skipped for Dependabot's CI-only updates (the "ci" label): resolving the
    # lowest allowed Composer versions says nothing about an Actions SHA or a
    # Semgrep pin. Keyed on the absence of "ci" rather than the presence of a
    # Composer label, because Dependabot drops custom labels that do not exist
    # in the repository - so the fallback is more testing, not less.
    #
    # Safe to gate because this is NOT a required status check. Do not make it
    # one without reading the note on the tests job first.
    if: |
      github.actor != 'dependabot[bot]' ||
      !contains(github.event.pull_request.labels.*.name, 'ci')
    needs: lint
    steps:
      # Download the repository source code to the runner
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install PHP without coverage since we only need basic functionality testing
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring  # Required extensions for the project
          coverage: none  # No coverage needed for dependency compatibility testing
          ini-values: memory_limit=-1  # Remove memory limit for Composer operations

      # Install the lowest allowed versions of all dependencies to test compatibility
      - name: Update to lowest dependencies
        run: composer deps:lowest

      # Run tests without coverage to verify functionality with minimum dependency versions
      - name: Run PHPUnit (no coverage)
        run: composer test
